<script>
// Adaptation du stockage : localStorage du navigateur (persistant, propre a chaque appareil)
window.storage = {
  get: function (k) {
    var v = localStorage.getItem("gainamax:" + k);
    return v === null ? Promise.reject(new Error("absent")) : Promise.resolve({ key: k, value: v });
  },
  set: function (k, v) {
    try { localStorage.setItem("gainamax:" + k, v); return Promise.resolve({ key: k, value: v }); }
    catch (e) { return Promise.reject(e); }
  },
};

 soutenue."},{id:"single-leg-glute-bridge",lateral:!0,code:"GMX-S10",nomFr:"Pont fessier une jambe",nomEn:"Single-leg glute bridge",type:"Statique",zones:["fessiers","lombaires"],diff:2,desc:"Pont fessier avec une jambe tendue, bassin stable."},{id:"plank-leg-raises",code:"GMX-D07",nomFr:"Planche + \xE9l\xE9vation de jambe",nomEn:"Plank leg raises",type:"Dynamique",zones:["abdos","transverse","fessiers"],diff:2,desc:"En planche coudes, lever alternativement une jambe tendue."},{id:"plank-arm-raises",code:"GMX-D08",nomFr:"Planche + \xE9l\xE9vation de bras",nomEn:"Plank arm raises",type:"Dynamique",zones:["abdos","transverse","epaules"],diff:2,desc:"En planche, tendre alternativement un bras devant soi."},{id:"shoulder-taps",code:"GMX-D09",nomFr:"Touchers d'\xE9paule en planche",nomEn:"Shoulder taps",type:"Dynamique",zones:["abdos","transverse","epaules"],diff:2,desc:"En planche bras tendus, toucher l'\xE9paule oppos\xE9e sans bouger le bassin."},{id:"alternating-superman",code:"GMX-D10",nomFr:"Superman altern\xE9 (nage)",nomEn:"Alternating superman",type:"Dynamique",zones:["lombaires","fessiers"],diff:2,desc:"\xC0 plat ventre, battements altern\xE9s bras/jambes oppos\xE9s."},{id:"slow-mountain-climbers",code:"GMX-D11",nomFr:"Grimpeur lent",nomEn:"Slow mountain climbers",type:"Dynamique",zones:["abdos","transverse","epaules"],diff:2,desc:"En planche bras tendus, ramener lentement les genoux vers la poitrine."},{id:"reverse-plank",code:"GMX-S11",nomFr:"Planche invers\xE9e",nomEn:"Reverse plank",type:"Statique",zones:["fessiers","lombaires","epaules"],diff:2,desc:"Face vers le plafond, appui mains et talons, bassin haut."},{id:"bear-hold",code:"GMX-S12",nomFr:"Position de l'ours",nomEn:"Bear hold",type:"Statique",zones:["transverse","epaules"],diff:2,desc:"En quadrup\xE9die, genoux d\xE9coll\xE9s de 5 cm, dos plat, maintien."},{id:"side-plank-hip-dips",lateral:!0,code:"GMX-D12",nomFr:"Descentes de bassin (planche lat\xE9rale)",nomEn:"Side plank hip dips",type:"Dynamique
