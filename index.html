<style>
:root{
  /* zones sûres : encoche/barre d'état en haut, barre de gestes en bas, coins arrondis */
  --sat: env(safe-area-inset-top, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
}
html{
  background:#16181D;              /* évite le flash blanc au lancement de la PWA */
  overscroll-behavior-y:contain;   /* neutralise le « tirer pour rafraîchir » d'Android */
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
html,body{margin:0;padding:0}
body{-webkit-tap-highlight-color:transparent}
#root{min-height:100vh;min-height:100dvh}
button,a,input,select,label{touch-action:manipulation} /* supprime le délai de double-tap */

<div id="root"></div>
<script>
// Adaptation du stockage : localStorage du navigateur (persistant, propre a chaque appareil)
window.storage = {
  get: function (k) {
    var v = localStorage.getItem("gainamax:" + k);
    return v === null ? Promise.reject(new Error("absent")) : Promise.resolve({ key: k, value: v });
  },
  set: function (k, v) {
    try { localStorage.setItem("gainamax:" + k, v); return Promise.resolve({ key: k, value: v }); }
    catch (e) { return Promise.reject(e); }
  },
};

// Android : garde l'écran allumé pendant une séance.
// L'app n'utilise qu'un seul setInterval (le chrono de séance, cadencé à 1 s) :
// on prend un Screen Wake Lock tant qu'il tourne, on le relâche à la fin.
(function () {
  if (!("wakeLock" in navigator)) return;               // ignoré si non supporté
  var verrou = null, suivis = new Set();
  var si = window.setInterval, ci = window.clearInterval;
  function prendre() {
    if (verrou || document.visibilityState !== "visible") return;
    navigator.wakeLock.request("screen").then(function (v) {
      verrou = v;
      v.addEventListener("release", function () { verrou = null; });
    }).catch(function () {});
  }
  function relacher() {
    if (!verrou) return;
    var v = verrou; verrou = null;
    v.release().catch(function () {});
  }
  window.setInterval = function (fn, delai) {
    var id = si.apply(window, arguments);
    if (delai <= 1000) { suivis.add(id); prendre(); }
    return id;
  };
  window.clearInterval = function (id) {
    if (suivis.delete(id) && suivis.size === 0) relacher();
    return ci.apply(window, arguments);
  };
  // Android relâche le verrou quand l'app passe en arrière-plan : on le reprend au retour.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && suivis.size > 0) prendre();
  });
})();
</script>
